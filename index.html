<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IronLog - Workout Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#121212" />

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --border: #2d2d2d;
      --accent: #4ade80; /* Mint Green */
      --accent-dim: rgba(74, 222, 128, 0.15);
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
      --radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      padding: 1rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    header .status { font-size: 0.8rem; color: var(--text-dim); }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      padding-bottom: 5rem;
    }

    /* Views */
    .view { display: none; }
    .view.active { display: block; }

    /* Exercise Card */
    .exercise-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .exercise-title { font-weight: 600; font-size: 1.05rem; }

    /* Set Table */
    .set-row {
      display: grid;
      grid-template-columns: 35px 1fr 1fr 45px 35px;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .set-header {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    input[type="number"], input[type="text"] {
      background: #262626;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
      color: var(--text);
      font-size: 0.95rem;
      text-align: center;
      width: 100%;
    }
    input:focus { outline: none; border-color: var(--accent); }

    /* Buttons */
    button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.8; }
    .btn-small { padding: 0.35rem 0.6rem; font-size: 0.8rem; }
    .btn-secondary {
      background: #2a2a2a;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-full { width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem; }
    .btn-check {
      background: #262626;
      border: 1px solid var(--border);
      color: var(--text-dim);
      height: 35px;
    }
    .btn-check.completed {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .btn-del {
      background: transparent;
      color: var(--danger);
      font-size: 1.1rem;
      border: none;
    }

    /* Rest Timer Bar */
    #timer-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      padding: 0.5rem 1rem;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    /* Bottom Nav Bar */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .nav-btn {
      background: none;
      color: var(--text-dim);
      flex-direction: column;
      font-size: 0.75rem;
      gap: 3px;
    }
    .nav-btn.active { color: var(--accent); }

    /* History List */
    .history-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 0.75rem;
      border-left: 4px solid var(--accent);
    }
    .history-card h3 { font-size: 1rem; margin-bottom: 0.35rem; }
    .history-meta { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.5rem; }
  </style>
</head>
<body>

  <!-- Rest Timer Banner -->
  <div id="timer-banner">
    <span>Rest Timer: <span id="timer-display">01:30</span></span>
    <button class="btn-small btn-secondary" onclick="stopTimer()">Skip</button>
  </div>

  <header>
    <h1>IronLog</h1>
    <span class="status" id="db-status">Local Mode (Ready for Sheet sync)</span>
  </header>

  <main>
    <!-- WORKOUT VIEW -->
    <div id="workout-view" class="view active">
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
        <input type="text" id="new-exercise-input" placeholder="Exercise name (e.g. Bench Press)" />
        <button class="btn-small" onclick="addExercise()">+ Add</button>
      </div>

      <div id="exercises-container"></div>

      <button class="btn-full" onclick="finishWorkout()">Finish Workout</button>
    </div>

    <!-- HISTORY VIEW -->
    <div id="history-view" class="view">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>Past Workouts</h2>
        <button class="btn-small btn-secondary" onclick="exportData()">Export JSON</button>
      </div>
      <div id="history-container"></div>
    </div>
  </main>

  <nav>
    <button class="nav-btn active" id="nav-workout" onclick="switchTab('workout')">
      <span>🏋️</span>Workout
    </button>
    <button class="nav-btn" id="nav-history" onclick="switchTab('history')">
      <span>📜</span>History
    </button>
  </nav>

  <script>
    // State management
    let currentWorkout = [];
    let timerInterval = null;
    let secondsRemaining = 0;

    // Load data from localStorage
    function getHistory() {
      return JSON.parse(localStorage.getItem('workout_history') || '[]');
    }

    function saveHistory(history) {
      localStorage.setItem('workout_history', JSON.stringify(history));
    }

    // UI Tab Navigation
    function switchTab(tab) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      if (tab === 'workout') {
        document.getElementById('workout-view').classList.add('active');
        document.getElementById('nav-workout').classList.add('active');
      } else {
        document.getElementById('history-view').classList.add('active');
        document.getElementById('nav-history').classList.add('active');
        renderHistory();
      }
    }

    // Add Exercise
    function addExercise() {
      const input = document.getElementById('new-exercise-input');
      const name = input.value.trim();
      if (!name) return;

      currentWorkout.push({
        id: Date.now(),
        name: name,
        sets: [{ weight: '', reps: '', completed: false }]
      });

      input.value = '';
      renderWorkout();
    }

    function removeExercise(index) {
      currentWorkout.splice(index, 1);
      renderWorkout();
    }

    function addSet(exerciseIndex) {
      const lastSet = currentWorkout[exerciseIndex].sets.slice(-1)[0] || { weight: '', reps: '' };
      currentWorkout[exerciseIndex].sets.push({
        weight: lastSet.weight,
        reps: lastSet.reps,
        completed: false
      });
      renderWorkout();
    }

    function removeSet(exerciseIndex, setIndex) {
      currentWorkout[exerciseIndex].sets.splice(setIndex, 1);
      renderWorkout();
    }

    function updateSet(exerciseIndex, setIndex, field, value) {
      currentWorkout[exerciseIndex].sets[setIndex][field] = value;
    }

    function toggleComplete(exerciseIndex, setIndex) {
      const set = currentWorkout[exerciseIndex].sets[setIndex];
      set.completed = !set.completed;
      renderWorkout();

      if (set.completed) {
        startTimer(90); // 90-second default rest
        if (navigator.vibrate) navigator.vibrate(100);
      }
    }

    // Timer Logic
    function startTimer(seconds) {
      clearInterval(timerInterval);
      secondsRemaining = seconds;
      const banner = document.getElementById('timer-banner');
      banner.style.display = 'flex';
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();
        if (secondsRemaining <= 0) {
          stopTimer();
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer-banner').style.display = 'none';
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(secondsRemaining / 60)).padStart(2, '0');
      const s = String(secondsRemaining % 60).padStart(2, '0');
      document.getElementById('timer-display').innerText = `${m}:${s}`;
    }

    // Render Workout Interface
    function renderWorkout() {
      const container = document.getElementById('exercises-container');
      container.innerHTML = '';

      currentWorkout.forEach((exercise, exIdx) => {
        const card = document.createElement('div');
        card.className = 'exercise-card';

        let setsHTML = `
          <div class="set-row set-header">
            <div>Set</div>
            <div>Lbs / Kg</div>
            <div>Reps</div>
            <div style="text-align:center">Done</div>
            <div></div>
          </div>
        `;

        exercise.sets.forEach((set, setIdx) => {
          setsHTML += `
            <div class="set-row">
              <div style="font-weight:600; color:var(--text-dim);">${setIdx + 1}</div>
              <input type="number" value="${set.weight}" placeholder="0" 
                oninput="updateSet(${exIdx}, ${setIdx}, 'weight', this.value)" />
              <input type="number" value="${set.reps}" placeholder="0" 
                oninput="updateSet(${exIdx}, ${setIdx}, 'reps', this.value)" />
              <button class="btn-check ${set.completed ? 'completed' : ''}" 
                onclick="toggleComplete(${exIdx}, ${setIdx})">✓</button>
              <button class="btn-del" onclick="removeSet(${exIdx}, ${setIdx})">×</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="exercise-header">
            <div class="exercise-title">${exercise.name}</div>
            <button class="btn-small btn-secondary" onclick="removeExercise(${exIdx})">Remove</button>
          </div>
          ${setsHTML}
          <button class="btn-small btn-secondary" style="margin-top:0.5rem;" onclick="addSet(${exIdx})">+ Add Set</button>
        `;

        container.appendChild(card);
      });
    }

    // Finish and Log Workout
    function finishWorkout() {
      if (currentWorkout.length === 0) return alert('No exercises to log!');

      const history = getHistory();
      const entry = {
        date: new Date().toISOString(),
        exercises: currentWorkout
      };

      history.unshift(entry);
      saveHistory(history);

      // (Hook for Option B: Google Sheets sync will go right here)

      currentWorkout = [];
      renderWorkout();
      alert('Workout saved!');
      switchTab('history');
    }

    // Render History
    function renderHistory() {
      const container = document.getElementById('history-container');
      const history = getHistory();
      container.innerHTML = '';

      if (history.length === 0) {
        container.innerHTML = '<p style="color:var(--text-dim)">No workouts logged yet.</p>';
        return;
      }

      history.forEach(item => {
        const dateStr = new Date(item.date).toLocaleDateString(undefined, {
          weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const card = document.createElement('div');
        card.className = 'history-card';
        
        let details = item.exercises.map(ex => {
          const totalSets = ex.sets.filter(s => s.completed).length || ex.sets.length;
          const bestSet = ex.sets.reduce((max, s) => Number(s.weight) > Number(max.weight || 0) ? s : max, {});
          return `<li><strong>${ex.name}</strong>: ${totalSets} sets (Top: ${bestSet.weight || 0} × ${bestSet.reps || 0})</li>`;
        }).join('');

        card.innerHTML = `
          <h3>Workout</h3>
          <div class="history-meta">${dateStr}</div>
          <ul style="padding-left:1.2rem; font-size:0.9rem; line-height:1.4;">${details}</ul>
        `;
        container.appendChild(card);
      });
    }

    // Export Fallback
    function exportData() {
      const blob = new Blob([localStorage.getItem('workout_history') || '[]'], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ironlog-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }
  </script>
</body>
</html>
